name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Build debug APKs (watch + phone)
        run: ./gradlew :wear:assembleDebug :phone:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: schedule-wear-debug
          path: wear/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: schedule-phone-debug
          path: phone/build/outputs/apk/debug/*.apk
